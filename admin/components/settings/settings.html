<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/settings.css">

<section id="settings" class="content-section active">
    <div class="form-section">
        <div class="section-header">
            <h2><i class="fas fa-cog"></i> System Settings</h2>
        </div>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="apiUrl">API Base URL</label>
                <input type="url" id="apiUrl" class="form-control" value="http://localhost:5000/api">
            </div>
            <div class="form-group">
                <label for="siteUrl">Website URL</label>
                <input type="url" id="siteUrl" class="form-control" value="http://localhost:3000">
            </div>
        </div>

        <div class="form-group">
            <label for="adminEmail">Admin Email</label>
            <input type="email" id="adminEmail" class="form-control" value="admin@hararilabour.gov.et">
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="saveSettings">
                <i class="fas fa-save"></i> Save Settings
            </button>
            <button class="btn btn-secondary" id="resetSettings">
                <i class="fas fa-undo"></i> Reset
            </button>
        </div>
    </div>

    <div class="form-section">
        <div class="section-header">
            <h2><i class="fas fa-shield-alt"></i> Security</h2>
        </div>
        
        <form id="passwordForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="currentPassword">Current Password *</label>
                    <input type="password" id="currentPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password *</label>
                    <input type="password" id="newPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="passwordSubmitBtn">
                    <i class="fas fa-key"></i> Change Password
                </button>
            </div>
        </form>
    </div>
</section>
