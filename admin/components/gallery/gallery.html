<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/gallery.css">

<section id="gallery" class="content-section active">
    <div class="form-section">
        <div class="section-header">
            <h2><i class="fas fa-upload"></i> Upload New Photo</h2>
        </div>
        
        <form id="galleryForm" enctype="multipart/form-data">
            <!-- Remove onclick from the div -->
<div class="file-upload" id="fileUploadArea">
    <i class="fas fa-cloud-upload-alt"></i>
    <h3>Click to upload photo</h3>
    <p>Supports JPG, PNG, GIF, WebP (Max 5MB)</p>
    <input type="file" id="galleryImage" accept="image/*" required>
</div>
            <div id="selectedFile" style="margin-top: 15px; display: none;"></div>

            <div class="form-grid" style="margin-top: 20px;">
                <div class="form-group">
                    <label for="galleryCaption">Caption</label>
                    <input type="text" id="galleryCaption" class="form-control" placeholder="Photo caption...">
                </div>
                <div class="form-group">
                    <label for="galleryCategory">Category *</label>
                    <select id="galleryCategory" class="form-control" required>
                        <option value="Meeting">Meeting</option>
                        <option value="Activities">Activities</option>
                        <option value="Regional Landscape">Regional Landscape</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="galleryAlt">Alt Text (Accessibility)</label>
                <input type="text" id="galleryAlt" class="form-control" placeholder="Description for screen readers">
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="gallerySubmitBtn">
                    <i class="fas fa-upload"></i> Upload Photo
                </button>
            </div>
        </form>
    </div>

    <div class="form-section">
        <div class="section-header">
            <h2><i class="fas fa-images"></i> Photo Gallery</h2>
            <div style="display: flex; gap: 10px;">
                <select id="galleryFilter" class="form-control" style="width: 150px;">
                    <option value="">All Categories</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Activities">Activities</option>
                    <option value="Regional Landscape">Regional Landscape</option>
                </select>
                <button class="btn btn-secondary" onclick="loadGallery()">
                    <i class="fas fa-sync"></i>
                </button>
            </div>
        </div>
        
        <div id="galleryGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
            <!-- Gallery items will be inserted here -->
        </div>
    </div>
</section>
