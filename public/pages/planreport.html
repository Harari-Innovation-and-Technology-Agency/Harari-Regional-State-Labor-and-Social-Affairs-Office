<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="plansTitle">Plans & Reports - Harari Labour and Social Affairs Office</title>

    <!-- Favicon -->
    <link rel="icon" href="/assets/images/orglogo.jpg" type="image/x-icon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Modular CSS -->
    <link rel="stylesheet" href="/css/main.css">
</head>

<body class="plan-report-page">

    <!-- Header will be loaded dynamically -->

    <!-- PAGE HEADER (Consistent with Services & News) -->
    <header class="page-header">
        <div class="container">
            <h1 data-i18n="plansReports">Plans & Reports</h1>
            <p data-i18n="plansReportsDesc">
                Access official development plans and institutional performance reports
            </p>
        </div>
    </header>

    <!-- MAIN SECTION -->
    <section class="plans-section">
        <div class="container">

            <h2 class="section-title" data-i18n="officialDocuments">
                Official Documents
            </h2>

            <!-- Dynamic Documents Container -->
            <div id="documents-container" class="documents-grid">
                <div class="services-loading">
                    <div class="loading-spinner"></div>
                    <p data-i18n="loadingDocuments">Loading documents...</p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer will be loaded dynamically -->
    <!-- Chatbot will be loaded dynamically -->

    <script type="module" src="/js/app.js"></script>

</body>
</html>
