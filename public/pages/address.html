<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Contact Us - Harari Labour and Social Affairs Office</title>
    <link rel="icon" href="../assets/images/orglogo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS - Modular Imports -->
        <link rel="stylesheet" href="/css/main.css">

</head>
<body>
    <!-- Header will be loaded dynamically -->
    
    <header class="page-header">
        <h1 data-i18n="contact">Contact Us</h1>
        <p data-i18n="contactdes">Keep in touch and send us your thoughts.</p>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <!-- Contact Form -->
            <div class="contact-in">
                <h2 data-i18n="contitle">Our Office Location</h2>
                <p data-i18n="contitledis">Have something to say or need additional information? Drop by our office.</p>
                
                <div class="contact-details">
                    <div class="contact-detail-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span data-i18n="address">Harar, Ethiopia</span>
                    </div>
                    <div class="contact-detail-item">
                        <i class="fas fa-phone"></i>
                        <span>025-666-46-66</span>
                    </div>
                    <div class="contact-detail-item">
                        <i class="fas fa-envelope"></i>
                        <a href="mailto:harariregionsocialaffairs@gmail.com">
                            harariregionsocialaffairs@gmail.com
                        </a>
                    </div>
                    <div class="contact-detail-item">
                        <i class="fas fa-clock"></i>
                        <span data-i18n="workHours">Mon-Fri: 8:30 AM - 5:00 PM</span>
                    </div>
                </div>

                <form id="contact-form">
                    <input type="text" name="name" placeholder="Full Name *" required>
                    <input type="email" name="email" placeholder="Email Address *" required>
                    <input type="tel" name="phone" placeholder="Phone Number">
                    <input type="text" name="subject" placeholder="Subject">
                    <textarea name="message" placeholder="Message *" required></textarea>
                    <button type="submit">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>

            <!-- Map -->
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d808.3962104739809!2d42.12079696283493!3d9.313257846184879!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1631bd0043dc990b%3A0x7f9abd3f63545c14!2z4YiA4Yio4YiqIOGIteGIqyDhiqDhiJjhiKvhiK3hipMg4Yqo4Yut4YuY4YqVIOGKouGKleGIteGJsuGJteGLqeGJtQ!5e1!3m2!1sen!2set!4v1758740612917!5m2!1sen!2set" 
                        width="600" height="450" style="border:0;" 
                        allowfullscreen="" loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </section>
    
    <!-- Footer will be loaded dynamically -->
    <!-- Chatbot will be loaded dynamically -->
    
    <script type="module" src="../js/app.js"></script>
</body>
</html>
