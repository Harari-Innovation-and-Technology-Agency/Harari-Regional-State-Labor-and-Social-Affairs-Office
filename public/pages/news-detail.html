<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">News Article - Harari Labour and Social Affairs Office</title>
    <link rel="icon" href="/assets/images/orglogo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS - Modular Imports -->
        <link rel="stylesheet" href="/css/main.css">

    
    <style>
        /* News Detail Page Specific Styles */
        .news-detail-section {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .news-detail-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        .news-detail-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .news-detail-title {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.3;
            font-weight: 700;
        }
        
        .news-detail-meta {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
            color: var(--gray);
            font-size: 1.1rem;
            flex-wrap: wrap;
        }
        
        .news-detail-meta i {
            margin-right: 8px;
            color: var(--accent);
        }
        
        .news-detail-content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--dark);
            margin-bottom: 40px;
        }
        
        .news-detail-content p {
            margin-bottom: 25px;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding: 12px 24px;
            background: var(--light);
            border-radius: 30px;
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }
        
        .back-button:hover {
            background: var(--primary);
            color: white;
            transform: translateX(-5px);
        }
        
        .share-buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid var(--border);
        }
        
        .share-button {
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        
        .share-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .share-facebook { background: #3b5998; }
        .share-twitter { background: #1da1f2; }
        .share-telegram { background: #0088cc; }
        .share-whatsapp { background: #25d366; }
        
        .loading-container {
            text-align: center;
            padding: 100px 20px;
        }
        
        .error-container {
            text-align: center;
            padding: 100px 20px;
            color: var(--error);
        }
        
        @media (max-width: 768px) {
            .news-detail-card {
                padding: 30px;
            }
            
            .news-detail-title {
                font-size: 1.8rem;
            }
            
            .news-detail-content {
                font-size: 1.1rem;
            }
            
            .news-detail-meta {
                flex-direction: column;
                gap: 10px;
            }
            
            .share-buttons {
                flex-wrap: wrap;
            }
        }
        
        @media (max-width: 480px) {
            .news-detail-card {
                padding: 20px;
            }
            
            .news-detail-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header will be loaded dynamically -->
    
    <section class="news-detail-section">
        <button onclick="goBack()" class="back-button">
            <i class="fas fa-arrow-left"></i> Back to News
        </button>
        
        <div id="news-detail-container" class="news-detail-card">
            <!-- News detail will be loaded dynamically -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p style="margin-top: 20px; color: var(--gray);">Loading article...</p>
            </div>
        </div>
    </section>
    
    <!-- Footer will be loaded dynamically -->
    <!-- Chatbot will be loaded dynamically -->
    
    <script type="module" src="/js/app.js"></script>
    <script>
        // Go back function
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
