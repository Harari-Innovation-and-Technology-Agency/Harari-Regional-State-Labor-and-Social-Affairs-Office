<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Photo Gallery - Harari Labour and Social Affairs Office</title>
    <link rel="icon" href="../assets/images/orglogo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS - Modular Imports -->
        <link rel="stylesheet" href="/css/main.css">

</head>
<body>
    <!-- Header will be loaded dynamically -->
    <header class="page-header">
        <div class="container">
        <h1 data-i18n="photo">Photo Gallery</h1>

      </div>
    </header>
    <section class="photo-gallery">
        
        <!-- Gallery Filters -->
        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Meeting" data-i18n="meet">Meeting</button>
            <button class="filter-btn" data-filter="Activities" data-i18n="activ">Activities</button>
            <button class="filter-btn" data-filter="Regional Landscape" data-i18n="land">Regional Landscape</button>
        </div>
        
        <!-- Dynamic Gallery Container -->
        <div id="gallery-container" class="gallery-row">
            <!-- Gallery items will be loaded dynamically from API -->
            <div class="loading-spinner-container">
                <div class="loading-spinner"></div>
                <p>Loading gallery...</p>
            </div>
        </div>
    </section>
    
    <!-- Footer will be loaded dynamically -->
    <!-- Chatbot will be loaded dynamically -->
    
    <script type="module" src="../js/app.js"></script>
</body>
</html>
